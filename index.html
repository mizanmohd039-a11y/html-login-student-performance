<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #ede9fe
            );
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .form-box {
            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.15);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #2563eb;

            border-radius: 50%;

            font-size: 38px;
        }

        h1 {
            text-align: center;

            color: #1e3a8a;

            font-size: 28px;
        }

        h2 {
            text-align: center;

            color: #2563eb;

            font-size: 20px;

            margin-top: 5px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            font-size: 14px;

            margin: 12px 0 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;

            font-weight: bold;
        }

        .required {
            color: red;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            background: white;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.12);
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 12px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="form-box">

        <div class="logo">
            🎓
        </div>

        <h1>
            Student Performance
        </h1>

        <h2>
            Prediction System
        </h2>

        <p class="subtitle">
            Enter your details to continue
        </p>


        <form onsubmit="continueToPrediction(event)">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Student Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Gmail
                    <span class="required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                    <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>


            <!-- BRANCH -->

            <div class="form-group">

                <label>
                    Branch
                    <span class="required">*</span>
                </label>

                <select id="branch" required>

                    <option value="">
                        Select your branch
                    </option>

                    <option value="CSE">
                        Computer Science & Engineering
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="ECE">
                        Electronics & Communication Engineering
                    </option>

                    <option value="EEE">
                        Electrical & Electronics Engineering
                    </option>

                    <option value="ME">
                        Mechanical Engineering
                    </option>

                    <option value="CE">
                        Civil Engineering
                    </option>

                </select>

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label>
                    Course
                    <span class="required">*</span>
                </label>

                <select id="course" required>

                    <option value="">
                        Select your course
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="B.Sc">
                        B.Sc
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="M.Tech">
                        M.Tech
                    </option>

                </select>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label>
                    Year
                    <span class="required">*</span>
                </label>

                <select id="year" required>

                    <option value="">
                        Select your year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                    <option value="4th Year">
                        4th Year
                    </option>

                </select>

            </div>


            <button type="submit">
                Continue to Prediction →
            </button>

        </form>


        <div class="footer">
            © 2026 Student Performance Prediction System
        </div>

    </div>

</div>


<script>

function continueToPrediction(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const phone =
        document.getElementById("phone").value;

    const branch =
        document.getElementById("branch").value;

    const course =
        document.getElementById("course").value;

    const year =
        document.getElementById("year").value;


    /*
       Send student data to Streamlit
    */

    const params = new URLSearchParams({

        name: name,

        email: email,

        phone: phone,

        branch: branch,

        course: course,

        year: year

    });


    const streamlitURL =
        "https://studentperformanceprediction-system-mohfrg8np6nsn4rivaiyek.streamlit.app/";


    window.location.href =
        streamlitURL + "?" + params.toString();

}

</script>

</body>

</html>
